<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Auxiliar Digital — 5.° "E" — I.E. 82019 La Florida del Inca</title>
<style>
:root{
  --navy:#152a54;
  --navy-2:#1e3a70;
  --red:#c8202f;
  --gold:#e8ac1f;
  --gold-light:#fbe7ab;
  --cream:#f7f4ec;
  --paper:#ffffff;
  --ink:#1c2230;
  --muted:#5c6478;
  --line:#e1ddd0;
  --c-nivel-c:#c8202f;
  --c-nivel-b:#e8ac1f;
  --c-nivel-a:#2d8a4e;
  --c-nivel-ad:#1e3a70;
  --radius:10px;
  --shadow:0 2px 10px rgba(21,42,84,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
}
h1,h2,h3,h4{font-family:'Georgia','Times New Roman',serif;margin:0 0 .4em;color:var(--navy);}
button{font-family:inherit;cursor:pointer;}
select,input,textarea{font-family:inherit;}

/* ---------- Top bar ---------- */
#topbar{
  background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy) 100%);
  color:#fff;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:var(--shadow);
  flex-wrap:nowrap;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
#topbar::-webkit-scrollbar{height:4px;}
#topbar img{height:40px;width:40px;border-radius:50%;background:#fff;padding:2px;flex-shrink:0;}
#topbar .brand{display:flex;flex-direction:column;flex:1;min-width:130px;flex-shrink:0;}
#topbar .brand b{font-size:.95rem;white-space:nowrap;}
#topbar .brand span{font-size:.72rem;color:var(--gold-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
#topbar .controls{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;flex-shrink:0;}
#topbar .controls .btn,#topbar .controls select{flex-shrink:0;}
#topbar select{
  background:rgba(255,255,255,.12);
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
  border-radius:7px;
  padding:6px 8px;
}
#topbar select option{color:#111;}
.btn{
  border:none;border-radius:8px;padding:8px 13px;font-size:.85rem;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:active{transform:scale(.97);}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-red{background:var(--red);color:#fff;}
.btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-ghost{background:var(--line);color:var(--navy);}
.btn:hover{box-shadow:0 3px 10px rgba(0,0,0,.18);}
.btn-sm{padding:5px 9px;font-size:.75rem;}

/* ---------- Layout ---------- */
#shell{display:flex;min-height:calc(100vh - 60px);}
#sidebar{
  width:270px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--line);
  padding:14px 10px 40px;overflow-y:auto;
}
#sidebar-header{display:none;}
#sidebar h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:16px 6px 6px;font-family:inherit;}
#sidebar h4:first-child{margin-top:4px;}
#sidebar-backdrop{
  display:none;position:fixed;inset:0;background:rgba(10,16,32,.5);z-index:139;
}
#sidebar-backdrop.show{display:block;}
.nav-item{
  display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:none;
  background:transparent;color:var(--ink);font-size:.84rem;margin-bottom:2px;
}
.nav-item:hover{background:var(--cream);}
.nav-item.active{background:var(--navy);color:#fff;font-weight:600;}
.nav-item small{display:block;color:var(--muted);font-size:.7rem;}
.nav-item.active small{color:var(--gold-light);}
#sidebar-toggle{display:none;}

#main{flex:1;padding:20px 24px 60px;max-width:1400px;}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow);
}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.pill{
  display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;
  letter-spacing:.03em;
}
.pill-area{background:var(--navy);color:#fff;}
.badge-nl{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;
  border-radius:6px;font-weight:800;font-size:.78rem;color:#fff;padding:0 6px;}
.nl-C{background:var(--c-nivel-c);}
.nl-B{background:var(--c-nivel-b);color:#3a2c00;}
.nl-A{background:var(--c-nivel-a);}
.nl-AD{background:var(--c-nivel-ad);}
.nl-vacio{background:#dcdcdc;color:#777;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table.grid{border-collapse:collapse;width:100%;font-size:.82rem;min-width:700px;}
table.grid th,table.grid td{border:1px solid var(--line);padding:6px 7px;text-align:center;}
table.grid thead th{background:var(--navy);color:#fff;position:sticky;top:0;z-index:2;font-size:.72rem;}
table.grid tbody tr:nth-child(even){background:#faf9f5;}
table.grid td.name-cell,table.grid th.name-cell{text-align:left;min-width:190px;position:sticky;left:0;
  background:var(--paper);z-index:1;font-weight:600;}
table.grid thead th.name-cell{background:var(--navy);z-index:3;}
table.grid select.cell-select{width:64px;border:1px solid var(--line);border-radius:5px;padding:2px;font-size:.74rem;background:#fff;}
table.grid input.cell-text{width:100%;border:1px solid transparent;background:transparent;text-align:center;font-size:.82rem;}
table.grid input.cell-text:focus{border-color:var(--gold);outline:none;background:#fffdf3;}
th.sess-head{cursor:pointer;min-width:58px;}
th.sess-head:hover{background:var(--navy-2);}
th.sess-head .sess-date{display:block;font-weight:400;font-size:.62rem;color:var(--gold-light);}

.pct-cell{font-weight:700;}
.verif-ok{color:#2d8a4e;font-weight:700;}
.verif-err{color:var(--red);font-weight:700;font-size:.72rem;}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
.field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:3px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;font-size:.85rem;background:#fff;
}
.field textarea{resize:vertical;min-height:60px;}

/* ---------- Misc ---------- */
.hint{color:var(--muted);font-size:.78rem;}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.section-title .num{background:var(--gold);color:var(--navy);border-radius:50%;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0;}
.standard-box{background:var(--cream);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;
  font-size:.82rem;color:#3a3f4d;margin:8px 0 14px;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:8px;}
.legend-row span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(21,26,40,.55);display:flex;align-items:center;
  justify-content:center;z-index:200;padding:16px;}
.modal{background:#fff;border-radius:12px;padding:20px 22px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{margin-top:0;}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.hidden{display:none !important;}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 18px;border-radius:30px;font-size:.85rem;box-shadow:var(--shadow);z-index:300;opacity:0;
  transition:opacity .25s ease;pointer-events:none;}
#toast.show{opacity:1;}

/* Resultados summary */
.summary-card{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:110px;
  text-align:center;box-shadow:var(--shadow);}
.stat b{display:block;font-size:1.3rem;color:var(--navy);}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}

/* Portada seal row */
.seal-row{display:flex;align-items:center;gap:18px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.seal-row img{height:74px;}
.seal-row .titles{text-align:center;}
.seal-row .titles h2{margin-bottom:2px;}
.seal-row .titles p{margin:0;color:var(--muted);font-size:.82rem;}

footer.app-footer{text-align:center;color:var(--muted);font-size:.72rem;padding:18px 0 40px;}

@media (max-width:900px){
  #sidebar{
    position:fixed;left:-100vw;top:0;bottom:0;width:86vw;max-width:340px;
    transition:left .22s ease;box-shadow:0 0 30px rgba(0,0,0,.3);z-index:140;
    padding-top:0;
  }
  #sidebar.open{left:0;}
  #sidebar-header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--navy);color:#fff;padding:14px 12px;position:sticky;top:0;z-index:2;
    margin:0 -10px 10px;
  }
  #sidebar-header b{font-size:.9rem;}
  #sidebar-header button{
    background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);
    border-radius:7px;padding:6px 12px;font-size:.8rem;font-weight:700;
  }
  #sidebar-toggle{display:inline-flex;}
  #main{padding:14px;}
}

</style>

const STORAGE_KEY = "registro5E_v1";

const NL_ORDER = ["C", "B", "A", "AD"];

let STATE = null;
let currentView = "portada";
let currentCompId = null;

// ---------- Inicialización de estado ----------
function defaultSesiones(nsesiones) {
  const arr = [];
  for (let i = 1; i <= nsesiones; i++) arr.push({ titulo: "S" + i, fecha: "" });
  return arr;
}
function emptyNotas(nsesiones) {
  return new Array(nsesiones).fill("");
}
function buildFreshTrimestre() {
  const t = { sesiones: {}, notas: {} };
  COMPETENCIAS.forEach(c => {
    t.sesiones[c.id] = defaultSesiones(c.nsesiones);
    t.notas[c.id] = {};
    STUDENTS_DEFAULT.forEach(s => { t.notas[c.id][s.id] = emptyNotas(c.nsesiones); });
  });
  return t;
}
function freshState() {
  const trimestres = {};
  TRIMESTRES.forEach(tr => { trimestres[tr] = buildFreshTrimestre(); });
  return {
    config: Object.assign({}, CONFIG_DEFAULT),
    students: JSON.parse(JSON.stringify(STUDENTS_DEFAULT)),
    trimestres
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return freshState();
    const parsed = JSON.parse(raw);
    // completar estructuras faltantes (por si se agregó una competencia nueva)
    if (!parsed.trimestres) parsed.trimestres = {};
    TRIMESTRES.forEach(tr => {
      if (!parsed.trimestres[tr]) parsed.trimestres[tr] = buildFreshTrimestre();
      const t = parsed.trimestres[tr];
      COMPETENCIAS.forEach(c => {
        if (!t.sesiones[c.id]) t.sesiones[c.id] = defaultSesiones(c.nsesiones);
        if (!t.notas[c.id]) t.notas[c.id] = {};
        (parsed.students || STUDENTS_DEFAULT).forEach(s => {
          if (!t.notas[c.id][s.id]) t.notas[c.id][s.id] = emptyNotas(t.sesiones[c.id].length);
        });
      });
    });
    if (!parsed.students || !parsed.students.length) parsed.students = JSON.parse(JSON.stringify(STUDENTS_DEFAULT));
    if (!parsed.config) parsed.config = Object.assign({}, CONFIG_DEFAULT);
    return parsed;
  } catch (e) {
    console.error("Error leyendo almacenamiento, se reinicia estado.", e);
    return freshState();
  }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
}

}

function equivalenceOf(val) {
  if (val === "" || val === null || val === undefined) return null;
  if (val === "I") return 50;
  if (val === "P") return 75;
  if (val === "PP") return 99;
  if (val === "L") return 100;
  if (val === "D") return 125;
  if (typeof val === "string" && val.endsWith("%")) {
    const n = parseInt(val, 10);
    return isNaN(n) ? null : n;
  }
  return null;
}
function computeStudentResult(compId, studentId) {
  const t = STATE.trimestres[STATE.config.trimestreActivo];
  const notas = (t.notas[compId] && t.notas[compId][studentId]) || [];
  let puntaje = 0, count = 0;
  notas.forEach(v => {
    const e = equivalenceOf(v);
    if (e !== null) { puntaje += e; count++; }
  });
  const max = count * 100;
  const pct = max > 0 ? puntaje / max : 0;
  let nl = "";
  if (max > 0) {
    if (pct <= 0.5) nl = "C";
    else if (pct < 1) nl = "B";
    else if (pct === 1) nl = "A";
    else nl = "AD";
  }
  const comp = COMPETENCIAS.find(c => c.id === compId);
  let conclusion = "";
  if (nl === "C") conclusion = comp.textoC;
  else if (nl === "B") conclusion = comp.textoB;
  else if (nl === "A") conclusion = comp.textoA;
  else if (nl === "AD") conclusion = comp.textoAD;
  return { puntaje, max, pct, nl, conclusion, sesionesRegistradas: count, sesionesTotal: notas.length };
}
function resultadosCompetencia(compId) {
  const counts = { C: 0, B: 0, A: 0, AD: 0 };
  let totalConNL = 0;
  STATE.students.forEach(s => {
    const r = computeStudentResult(compId, s.id);
    if (r.nl) { counts[r.nl]++; totalConNL++; }
  });
  const verif = totalConNL === STATE.students.length
    ? "OK"
    : `Faltan ${STATE.students.length - totalConNL} de ${STATE.students.length}`;
  return { counts, totalConNL, verif };
}
function sesionEstado(compId, sessionIdx) {
  const t = STATE.trimestres[STATE.config.trimestreActivo];
  const sesion = t.sesiones[compId][sessionIdx];
  let calificados = 0;
  STATE.students.forEach(s => {
    const v = t.notas[compId][s.id][sessionIdx];
    if (equivalenceOf(v) !== null) calificados++;
  });
  let estado = "No realizada";
  if (calificados === STATE.students.length && STATE.students.length > 0) estado = "Evaluada completa";
  else if (calificados > 0) estado = "En progreso";
  else if (sesion.fecha) estado = "Realizada (pendiente calificar)";
  return { calificados, total: STATE.students.length, estado, titulo: sesion.titulo, fecha: sesion.fecha };
}

function formatPct(r) {
  if (r.max <= 0) return "—";
  let p = Math.round(r.pct * 100);
  // Evitar mostrar "100%" cuando en realidad el NL es B (redondeo engañoso, p.ej. 99.5% -> 100%)
  if (p >= 100 && r.nl !== "A" && r.pct < 1) p = 99;
  if (p <= 0 && r.pct > 0) p = 1;
  return p + "%";
}
function updateStudentRowResult(tr, compId, studentId) {
  const r = computeStudentResult(compId, studentId);
  tr.querySelector(".res-puntaje").textContent = r.max > 0 ? r.puntaje : "—";
  tr.querySelector(".res-max").textContent = r.max > 0 ? r.max : "—";
  tr.querySelector(".res-pct").textContent = formatPct(r);
  const nlTd = tr.querySelector(".res-nl");
  nlTd.innerHTML = "";
  const badge = document.createElement("span");
  badge.className = "badge-nl " + (r.nl ? "nl-" + r.nl : "nl-vacio");
  badge.textContent = r.nl || "—";
  nlTd.appendChild(badge);
  tr.querySelector(".res-conclusion").textContent = r.conclusion || "—";
}

    tr.appendChild(td(`${sesionesInfo.hechas}/${sesionesInfo.total}`));
    tr.appendChild(td(res.counts.C));
    tr.appendChild(td(res.counts.B));
    tr.appendChild(td(res.counts.A));
    tr.appendChild(td(res.counts.AD));
    tr.appendChild(td(res.totalConNL));
    const verifTd = document.createElement("td");
    verifTd.innerHTML = res.verif === "OK" ? `<span class="verif-ok">OK</span>` : `<span class="verif-err">${res.verif}</span>`;
    tr.appendChild(verifTd);
    tr.onclick = () => { currentView = "competencia"; currentCompId = c.id; render(); };
    tr.style.cursor = "pointer";
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tw.appendChild(table);

  const stats = document.createElement("div");
  stats.className = "summary-card";
  stats.innerHTML = `
    <div class="stat"><b>${totalC}</b><span>Total C</span></div>
    <div class="stat"><b>${totalB}</b><span>Total B</span></div>
    <div class="stat"><b>${totalA}</b><span>Total A</span></div>
    <div class="stat"><b>${totalAD}</b><span>Total AD</span></div>
    <div class="stat"><b>${STATE.students.length}</b><span>Estudiantes</span></div>
    <div class="stat"><b>${COMPETENCIAS.length}</b><span>Competencias</span></div>`;
  card.appendChild(stats);
  card.appendChild(tw);
  wrap.appendChild(card);
  return wrap;
}
function sesionesResumen(compId) {
  const t = STATE.trimestres[STATE.config.trimestreActivo];
  const total = t.sesiones[compId].length;
  let hechas = 0;
  for (let i = 0; i < total; i++) {
    const est = sesionEstado(compId, i);
    if (est.estado !== "No realizada") hechas++;
  }
  return { hechas, total };
}

function exportBackupJSON() {
  const blob = new Blob([JSON.stringify(STATE, null, 1)], { type: "application/json" });
  downloadBlob(blob, `backup_registro_5E_${todayStr()}.json`);

function importBackupJSON(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      STATE = parsed;
      saveState();
      render();
      toast("Copia de seguridad importada correctamente.");
    } catch (e) {
      alert("El archivo no es una copia de seguridad válida.");
    }
  };
  reader.readAsText(file);
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

// Generación de Informe de Progreso en PDF (jsPDF + autotable)
// ============================================================
function openInformeModal() {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.style.maxWidth = "560px";
  modal.style.maxHeight = "85vh";
  modal.style.display = "flex";
  modal.style.flexDirection = "column";

  modal.innerHTML = `
    <h3>📄 Informe de aprendizaje para la familia</h3>
    <p class="hint">Trimestre activo: <b>${STATE.config.trimestreActivo}</b>. Elige un estudiante para su PDF individual, o genera los ${STATE.students.length} de una vez.</p>
    <button class="btn btn-gold" id="m-todos" style="width:100%;justify-content:center;margin:6px 0 10px;">📦 Generar TODOS los estudiantes (${STATE.students.length}) en un ZIP</button>
    <div class="field"><input id="m-buscar" placeholder="🔎 Buscar estudiante por nombre..." style="width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;"></div>
    <div id="m-lista" style="overflow-y:auto;flex:1;border:1px solid var(--line);border-radius:8px;margin-top:8px;"></div>
    <div class="actions"><button class="btn btn-ghost" id="m-cancel">Cerrar</button></div>
  `;
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  const lista = modal.querySelector("#m-lista");
  function pintarLista(filtro) {
    lista.innerHTML = "";
    const f = (filtro || "").trim().toLowerCase();
    STATE.students.slice().sort((a,b)=>a.n-b.n)
      .filter(s => !f || s.nombre.toLowerCase().includes(f))
      .forEach(s => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);";
        row.innerHTML = `<span style="font-size:.85rem;">${s.n}. ${s.nombre}</span>`;
        const btn = document.createElement("button");
        btn.className = "btn btn-navy btn-sm";
        btn.textContent = "Generar PDF";
        btn.onclick = () => generarInformeIndividual(s.id);
        row.appendChild(btn);
        lista.appendChild(row);
      });
    if (!lista.children.length) lista.innerHTML = `<p class="hint" style="padding:10px;">Sin resultados.</p>`;
  }
  pintarLista("");
  modal.querySelector("#m-buscar").oninput = (e) => pintarLista(e.target.value);
  modal.querySelector("#m-todos").onclick = () => { generarInformesTodos(); backdrop.remove(); };
  modal.querySelector("#m-cancel").onclick = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) backdrop.remove(); };
}

async function generarInformesTodos() {
  if (typeof JSZip === "undefined") { alert("No se pudo cargar el empaquetador ZIP. Verifica tu conexión a internet e inténtalo de nuevo."); return; }
  toast(`Generando ${STATE.students.length} informes, un momento…`);
  const zip = new JSZip();
  const ordenados = STATE.students.slice().sort((a,b)=>a.n-b.n);
  for (const s of ordenados) {
    const { blob, filename } = generarInformeIndividual(s.id, { download: false });
    zip.file(filename, blob);
    await new Promise(r => setTimeout(r, 0)); // ceder el hilo para no congelar la UI
  }
  const zipBlob = await zip.generateAsync({ type: "blob" });
  downloadBlob(zipBlob, `Informes_Familia_5E_Trim${STATE.config.trimestreActivo}_${todayStr()}.zip`);
  toast("Informes de todos los estudiantes generados.");
}

function pdfHeader(doc, titulo) {
  const pageWidth = doc.internal.pageSize.getWidth();
  try { doc.addImage(IMG_SELLO_GRADO, "PNG", 14, 10, 20, 20); } catch(e){}
  try { doc.addImage(IMG_SELLO_UGEL, "PNG", pageWidth - 34, 10, 20, 20); } catch(e){}
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.setTextColor(21, 42, 84);
  doc.text(STATE.config.institucion, pageWidth / 2, 15, { align: "center" });
  doc.setFontSize(9);
  doc.setFont("helvetica", "normal");
  doc.text(`${STATE.config.ugel} · ${STATE.config.dre}`, pageWidth / 2, 20, { align: "center" });
  doc.text(`${STATE.config.grado} Grado "${STATE.config.seccion}" · ${STATE.config.nivel} · Año ${STATE.config.anio}`, pageWidth / 2, 25, { align: "center" });
  doc.setFontSize(13);
  doc.setFont("helvetica", "bold");
  doc.text(titulo, pageWidth / 2, 33, { align: "center" });
  doc.setDrawColor(232, 172, 31);
  doc.setLineWidth(1);
  doc.line(14, 36, pageWidth - 14, 36);
  return 42;
}
function pdfFooterFirma(doc) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const y = pageHeight - 34;
  try { doc.addImage(IMG_FIRMA, "PNG", pageWidth / 2 - 25, y - 12, 50, 16); } catch(e){}
  doc.setDrawColor(60,60,60);
  doc.setLineWidth(0.2);
  doc.line(pageWidth / 2 - 35, y + 6, pageWidth / 2 + 35, y + 6);
  doc.setFontSize(9);
  doc.setFont("helvetica", "bold");
  doc.text(STATE.config.docente, pageWidth / 2, y + 11, { align: "center" });
  doc.setFont("helvetica", "normal");
  doc.text(`DNI ${STATE.config.docenteDni} · Docente ${STATE.config.grado} "${STATE.config.seccion}"`, pageWidth / 2, y + 15, { align: "center" });
}
function pdfPageNumbers(doc) {
  const pageCount = doc.internal.getNumberOfPages();
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(120);
    doc.text(`Pág. ${i} de ${pageCount} — Generado el ${new Date().toLocaleDateString("es-PE")}`, pageWidth - 14, pageHeight - 8, { align: "right" });
  }
}


function generarInformeIndividual(studentId, opts) {
  opts = opts || { download: true };
  const s = STATE.students.find(x => x.id === studentId);
  if (!s) { alert("Selecciona un estudiante."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const marginL = 14, marginR = 14, contentW = pageWidth - marginL - marginR;
  let y = pdfHeader(doc, `Informe de Aprendizaje para la Familia`);

  doc.setFillColor(247, 244, 236);
  doc.roundedRect(marginL, y, contentW, 16, 2, 2, "F");
  doc.setFontSize(11);
  doc.setFont("helvetica", "bold");
  doc.setTextColor(21, 42, 84);
  doc.text(s.nombre, marginL + 4, y + 6.5);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text(`DNI: ${s.dni || "—"}   |   ${STATE.config.grado} Grado "${STATE.config.seccion}"   |   Trimestre ${STATE.config.trimestreActivo}`, marginL + 4, y + 12);
  y += 22;

  const nlColors = { C: [200, 32, 47], B: [232, 172, 31], A: [45, 138, 78], AD: [30, 58, 112] };
  const nlBg = { C: [252, 231, 233], B: [253, 243, 214], A: [226, 244, 232], AD: [222, 229, 244] };

  function ensureSpace(needed) {
    if (y + needed > pageHeight - 40) {
      doc.addPage();
      y = pdfHeader(doc, "Informe de Aprendizaje para la Familia (continuación)");
    }
  }

  let areaActual = null;
  COMPETENCIAS.forEach(c => {
    const r = computeStudentResult(c.id, s.id);
    const nl = r.nl || "—";
    const conclusion = r.conclusion || "Aún no se han registrado suficientes sesiones evaluadas en esta competencia durante el trimestre.";
    const recomendacion = recomendacionFor(r.nl);

    if (c.area !== areaActual) {
      areaActual = c.area;
      ensureSpace(12);
      doc.setFillColor(21, 42, 84);
      doc.rect(marginL, y, contentW, 7, "F");
      doc.setFontSize(9.5);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(255, 255, 255);
      doc.text(areaActual, marginL + 3, y + 5);
      y += 11;
    }

    const compTitleLines = doc.splitTextToSize(c.competencia, contentW - 26);
    const conclusionLines = doc.splitTextToSize(conclusion, contentW - 6);
    const recLines = doc.splitTextToSize(recomendacion, contentW - 6);
    const sesionesTxt = `Sesiones evaluadas: ${r.sesionesRegistradas}/${r.sesionesTotal}`;
    const blockHeight = 6 + compTitleLines.length * 4.2 + 5 + conclusionLines.length * 4 + 3 + recLines.length * 4 + 6;

    ensureSpace(blockHeight + 4);
    const blockTop = y;

    // Franja de color según NL a la izquierda
    const col = nlColors[nl] || [150, 150, 150];
    doc.setFillColor(col[0], col[1], col[2]);
    doc.rect(marginL, blockTop, 2.2, blockHeight, "F");

    doc.setFontSize(9.5);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(30, 34, 48);
    doc.text(compTitleLines, marginL + 6, blockTop + 5);

    // Badge NL
    const bg = nlBg[nl] || [230, 230, 230];
    doc.setFillColor(bg[0], bg[1], bg[2]);
    doc.roundedRect(pageWidth - marginR - 16, blockTop + 1, 14, 6, 1.5, 1.5, "F");
    doc.setFontSize(9);
    doc.setTextColor(col[0], col[1], col[2]);
    doc.setFont("helvetica", "bold");
    doc.text(nl, pageWidth - marginR - 9, blockTop + 5.2, { align: "center" });

    let yy = blockTop + 5 + compTitleLines.length * 4.2 + 1;
    doc.setFontSize(8.5);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(60, 64, 76);
    doc.text(sesionesTxt, marginL + 6, yy);
    yy += 4.5;

    doc.setFont("helvetica", "italic");
    doc.setTextColor(50, 54, 66);
    doc.text(conclusionLines, marginL + 6, yy);
    yy += conclusionLines.length * 4 + 2;

    doc.setFont("helvetica", "bold");
    doc.setTextColor(col[0], col[1], col[2]);
    doc.text(recLines, marginL + 6, yy);

    y = blockTop + blockHeight + 4;
  });

  pdfFooterFirma(doc);
  pdfPageNumbers(doc);
  const filename = `Informe_Familia_${s.nombre.replace(/[^a-zA-Z0-9]+/g,"_")}_Trim${STATE.config.trimestreActivo}_${todayStr()}.pdf`;
  if (opts.download === false) {
    return { blob: doc.output("blob"), filename };
  }
  doc.save(filename);
  toast("Informe individual generado.");
}

// Exportación a Excel con estructura tipo SIAGIE (SheetJS)
// ============================================================
function exportSiagieExcel() {
  const wb = XLSX.utils.book_new();

  // Hoja Generalidades
  const gData = [
    ["INSTITUCIÓN EDUCATIVA", STATE.config.institucion],
    ["CÓDIGO MODULAR", STATE.config.codModular],
    ["UGEL", STATE.config.ugel],
    ["DRE", STATE.config.dre],
    ["NIVEL", STATE.config.nivel],
    ["GRADO", STATE.config.grado],
    ["SECCIÓN", STATE.config.seccion],
    ["AÑO", STATE.config.anio],
    ["TRIMESTRE", STATE.config.trimestreActivo],
    ["DOCENTE", STATE.config.docente],
    ["DNI DOCENTE", STATE.config.docenteDni],
    ["DIRECTOR(A)", STATE.config.director],
    ["FECHA DE EXPORTACIÓN", todayStr()],
  ];
  const wsGen = XLSX.utils.aoa_to_sheet(gData);
  wsGen["!cols"] = [{ wch: 24 }, { wch: 46 }];
  XLSX.utils.book_append_sheet(wb, wsGen, "Generalidades");

  // Hoja Parametros (escala)
  const pData = [
    ["LETRA", "EQUIVALENCIA"], ["I", "50%"], ["P", "75%"], ["PP", "99%"], ["L", "100%"], ["D", "125%"],
    [], ["NL", "RANGO"], ["C", "0% - 50%"], ["B", "51% - 99%"], ["A", "100%"], ["AD", "101% - 125%"],
  ];
  const wsPar = XLSX.utils.aoa_to_sheet(pData);
  XLSX.utils.book_append_sheet(wb, wsPar, "Parametros");

  // Hojas por área SIAGIE
  const byCode = {};
  COMPETENCIAS.forEach(c => { (byCode[c.siagieCode] = byCode[c.siagieCode] || []).push(c); });
  const areaNames = {
    "067": "067-PPSS", "0005": "0005-COMU", "063": "063-MATE", "0004": "0004-CIENC TEC",
    "0001": "0001-ART Y CULT", "035": "035-EREL", "0006": "0006-DESEN TIC", "0007": "0007-GEST AUTO"
  };
  const order = ["0001", "0004", "0005", "035", "063", "067", "0006", "0007"];
  order.forEach(code => {
    const comps = byCode[code];
    if (!comps) return;
    const header = ["ID (DNI)", "Cód. Estudiante", "Apellidos y Nombres"];
    comps.forEach(c => { header.push(c.competencia + " (NL)"); header.push(c.competencia + " (Conclusión)"); });
    const rows = [header];
    STATE.students.slice().sort((a,b)=>a.n-b.n).forEach(s => {
      const row = [s.dni || "", s.codigoSiagie || "", s.nombre.toUpperCase()];
      comps.forEach(c => {
        const r = computeStudentResult(c.id, s.id);
        row.push(r.nl || "");
        row.push(r.conclusion || "");
      });
      rows.push(row);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 12 }, { wch: 18 }, { wch: 32 }].concat(
      comps.flatMap(() => [{ wch: 8 }, { wch: 60 }])
    );
    XLSX.utils.book_append_sheet(wb, ws, areaNames[code] || code);
  });

  // Hoja de progreso de sesiones
  const sesRows = [["Área", "Competencia", "Sesión", "Título", "Fecha", "Calificados", "Total", "Estado"]];
  const t = STATE.trimestres[STATE.config.trimestreActivo];
  COMPETENCIAS.forEach(c => {
    t.sesiones[c.id].forEach((s, idx) => {
      const est = sesionEstado(c.id, idx);
      sesRows.push([c.area, c.competencia, "S" + (idx + 1), s.titulo, s.fecha || "", est.calificados, est.total, est.estado]);
    });
  });
  const wsSes = XLSX.utils.aoa_to_sheet(sesRows);
  wsSes["!cols"] = [{ wch: 20 }, { wch: 30 }, { wch: 8 }, { wch: 24 }, { wch: 12 }, { wch: 10 }, { wch: 8 }, { wch: 22 }];
  XLSX.utils.book_append_sheet(wb, wsSes, "Progreso_Sesiones");

  XLSX.writeFile(wb, `Export_SIAGIE_5E_Trim${STATE.config.trimestreActivo}_${todayStr()}.xlsx`);
  toast("Excel tipo SIAGIE exportado.");
}
